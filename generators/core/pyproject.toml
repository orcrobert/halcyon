[project]
name = "halcyon-generator"
version = "0.1.0"
description = "Reference implementation of the Halcyon generator contract"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "pydantic>=2",
    "uvicorn[standard]",
]

[project.scripts]
halcyon-generator = "halcyon_generator.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
audiocraft = [
    "torch==2.1.2",
    "torchvision==0.16.2",
    "torchaudio==2.1.2",
    "xformers==0.0.23.post1",
    "numpy<2",
    "transformers==5.10.1",
    "av==12.0.0",
    "encodec",
    "lameenc",
    "num2words",
    "spacy",
    "demucs",
    "cloudpickle",
    "flashy",
    "torchmetrics",
    "torchdiffeq",
    "julius",
    "einops",
    "omegaconf",
    "hydra-core",
    "hydra-colorlog",
    "sentencepiece",
    "soundfile",
    "librosa",
    "huggingface_hub",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["halcyon_generator*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
