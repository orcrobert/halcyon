[project]
name = "halcyon-generator"
version = "0.1.0"
description = "Reference implementation of the Halcyon generator contract"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "pydantic>=2",
    "uvicorn[standard]",
]

[project.optional-dependencies]
serve = ["uvicorn[standard]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["halcyon_generator*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
