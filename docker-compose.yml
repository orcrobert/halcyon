services:
  halcyon:
    build:
      context: .
      target: ${HALCYON_TARGET:-runtime}
    image: halcyon:latest
    restart: unless-stopped
    ports:
      - "${HALCYON_PORT:-8001}:8001"
    environment:
      GENERATOR_URL: ${GENERATOR_URL:-http://host.docker.internal:9000}
      DECOMPOSER_PROVIDER: ${DECOMPOSER_PROVIDER:-gemini}
      DECOMPOSER_MODEL: ${DECOMPOSER_MODEL:-}
      DECOMPOSER_BASE_URL: ${DECOMPOSER_BASE_URL:-}
      DECOMPOSER_API_KEY: ${DECOMPOSER_API_KEY:-}
      DECOMPOSER_ALLOW_CLI: ${DECOMPOSER_ALLOW_CLI:-false}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      SECRET_KEY: ${SECRET_KEY:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      MODAL_TOKEN_ID: ${MODAL_TOKEN_ID:-}
      MODAL_TOKEN_SECRET: ${MODAL_TOKEN_SECRET:-}
    volumes:
      - halcyon-data:/data
    tmpfs:
      - /tmp
    read_only: true
    init: true
    security_opt:
      - no-new-privileges:true
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  halcyon-data:
