name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ./mixer -e ".[dev]"
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: halcyon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot the image and check it serves
        run: |
          docker run -d --name halcyon-ci -p 8001:8001 \
            --read-only --tmpfs /tmp -v halcyon-ci-data:/data \
            halcyon:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' halcyon-ci)" = "healthy" ] && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' halcyon-ci)" = "healthy"
          curl -fsS localhost:8001/health
          curl -fsS localhost:8001/ | grep -q "<!doctype html"
          docker exec halcyon-ci python -c "from api.app.services.decomposer import _load_prompt; _load_prompt('decomposer')"
          docker exec halcyon-ci python -c "
import numpy as np, soundfile as sf
from mixer.core import analyze
rng = np.random.default_rng(0)
sf.write('/tmp/ci-tone.wav', rng.normal(0, 0.05, 44100).astype(np.float32), 22050)
valid, wavs, srs = analyze([{'file': '/tmp/ci-tone.wav', 'label': 'noise', 'type': 'sound'}])
assert valid and valid[0].get('eq_json'), valid
print('mixer analyze OK:', valid[0]['volume'], valid[0]['pan'])"
      - if: always()
        run: docker logs halcyon-ci || true
