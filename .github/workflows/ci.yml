name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ./mixer -e ".[dev]"
      - run: ruff check .
      - run: pytest

  generator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: generators/core
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          tags: halcyon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot the image and check it serves
        run: |
          docker run -d --name halcyon-ci -p 8001:8001 \
            --read-only --tmpfs /tmp -v halcyon-ci-data:/data \
            halcyon:ci
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' halcyon-ci)" = "healthy" ] && break
            sleep 2
          done
          test "$(docker inspect -f '{{.State.Health.Status}}' halcyon-ci)" = "healthy"
          curl -fsS localhost:8001/health
          curl -fsS localhost:8001/ | grep -q "<!doctype html"
          docker exec halcyon-ci python -c "from api.app.services.prompts import default_decomposer_prompt; default_decomposer_prompt()"
      - name: Check the mixer runs under the read-only rootfs
        run: docker exec -i halcyon-ci python - < .github/scripts/mix_smoke.py
      - if: always()
        run: docker logs halcyon-ci || true
